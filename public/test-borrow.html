<!DOCTYPE html>
<html>
<head>
    <title>Test Borrow Functionality</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a87; }
        .result { margin: 10px 0; padding: 10px; border-radius: 3px; white-space: pre-wrap; font-family: monospace; max-height: 300px; overflow-y: auto; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; width: 200px; }
        .form-row { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
        label { display: inline-block; width: 100px; }
    </style>
</head>
<body>
    <h1>📚 Test Borrow Functionality</h1>
    
    <div class="test-section">
        <h3>🚀 Quick Setup</h3>
        <button onclick="autoSetup()" class="big-button" style="padding: 15px 25px; font-size: 16px; font-weight: bold; background: #28a745;">🔧 AUTO SETUP (Create Users & Books)</button>
        <div id="setup-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 1: Check Prerequisites</h3>
        <button onclick="checkUsers()">Check Users</button>
        <button onclick="checkBooks()">Check Books</button>
        <button onclick="checkBorrows()">Check Borrows Table</button>
        <div id="prereq-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 2: Test Borrow Book</h3>
        <div class="form-row">
            <label>User ID:</label>
            <input type="number" id="user-id" value="1" min="1" />
        </div>
        <div class="form-row">
            <label>Book ID:</label>
            <input type="number" id="book-id" value="1" min="1" />
        </div>
        <button onclick="testBorrow()">Test Borrow Book</button>
        <div id="borrow-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 3: View Borrows</h3>
        <button onclick="viewAllBorrows()">View All Borrows</button>
        <button onclick="viewUserBorrows()">View User Borrows</button>
        <div id="view-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 4: Test Return Book</h3>
        <div class="form-row">
            <label>Borrow ID:</label>
            <input type="number" id="borrow-id" placeholder="Enter borrow ID" />
        </div>
        <button onclick="testReturn()">Test Return Book</button>
        <div id="return-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';

        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.textContent = message;
        }

        async function makeRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function autoSetup() {
            showResult('setup-result', '🔧 Running auto-setup...', 'info');
            
            const result = await makeRequest('/auto-setup');
            if (result.success) {
                showResult('setup-result', `✅ Auto-Setup Complete!\n${JSON.stringify(result.data, null, 2)}`, 'success');
                
                // Auto-populate the form with the first user ID
                if (result.data.current_users && result.data.current_users.length > 0) {
                    document.getElementById('user-id').value = result.data.current_users[0].id;
                }
                if (result.data.current_books && result.data.current_books.length > 0) {
                    document.getElementById('book-id').value = result.data.current_books[0].id;
                }
            } else {
                showResult('setup-result', `❌ Auto-Setup Failed: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function checkUsers() {
            const result = await makeRequest('/debug-users');
            if (result.success) {
                showResult('prereq-result', `✅ Users Check:\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('prereq-result', `❌ Users Check Failed: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function checkBooks() {
            const result = await makeRequest('/books');
            if (result.success) {
                showResult('prereq-result', `✅ Books Check:\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('prereq-result', `❌ Books Check Failed: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function checkBorrows() {
            const result = await makeRequest('/borrows');
            if (result.success) {
                showResult('prereq-result', `✅ Borrows Check:\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('prereq-result', `❌ Borrows Check Failed: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function testBorrow() {
            const userId = document.getElementById('user-id').value;
            const bookId = document.getElementById('book-id').value;

            if (!userId || !bookId) {
                showResult('borrow-result', '❌ Please enter both User ID and Book ID', 'error');
                return;
            }

            const result = await makeRequest('/borrows', {
                method: 'POST',
                body: JSON.stringify({
                    user_id: parseInt(userId),
                    book_id: parseInt(bookId)
                })
            });

            if (result.success) {
                showResult('borrow-result', `✅ Borrow Success!\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('borrow-result', `❌ Borrow Failed: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function viewAllBorrows() {
            const result = await makeRequest('/borrows');
            if (result.success) {
                showResult('view-result', `✅ All Borrows:\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('view-result', `❌ Failed to get borrows: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function viewUserBorrows() {
            const userId = document.getElementById('user-id').value;
            const result = await makeRequest(`/my-borrows?user_id=${userId}`);
            if (result.success) {
                showResult('view-result', `✅ User ${userId} Borrows:\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('view-result', `❌ Failed to get user borrows: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function testReturn() {
            const borrowId = document.getElementById('borrow-id').value;
            if (!borrowId) {
                showResult('return-result', '❌ Please enter a Borrow ID', 'error');
                return;
            }

            const result = await makeRequest(`/borrows/${borrowId}/return`, {
                method: 'PUT'
            });

            if (result.success) {
                showResult('return-result', `✅ Return Success!\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('return-result', `❌ Return Failed: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        // Auto-run setup check on page load
        window.onload = function() {
            showResult('setup-result', 'Click "AUTO SETUP" to create demo users and books automatically!', 'info');
        };
    </script>
</body>
</html>
