<!DOCTYPE html>
<html>
<head>
    <title>Quick Login Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a87; }
        .result { margin: 10px 0; padding: 10px; border-radius: 3px; white-space: pre-wrap; font-family: monospace; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>🔧 Quick Login Test & Fix</h1>
    
    <div class="test-section">
        <h3>Step 1: Test API Connection</h3>
        <button onclick="testAPI()">Test Basic API</button>
        <div id="api-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 2: Create Demo Users</h3>
        <button onclick="createUsers()">Create Demo Users</button>
        <div id="users-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 3: Test Login</h3>
        <button onclick="testLogin()">Test AuthController Login</button>
        <button onclick="testSimpleLogin()">Test Simple Login</button>
        <div id="login-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 4: Test All Demo Logins</h3>
        <button onclick="testAllLogins()">Test All Demo Accounts</button>
        <div id="all-login-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';

        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.textContent = message;
        }

        async function testAPI() {
            try {
                const response = await fetch(`${API_BASE}/test`, {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                showResult('api-result', `✅ API Working!\n${JSON.stringify(data, null, 2)}`, 'success');
            } catch (error) {
                showResult('api-result', `❌ API Error: ${error.message}`, 'error');
            }
        }

        async function createUsers() {
            try {
                const response = await fetch(`${API_BASE}/create-demo-users`, {
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                showResult('users-result', `✅ Users Created!\n${JSON.stringify(data, null, 2)}`, 'success');
            } catch (error) {
                showResult('users-result', `❌ User Creation Error: ${error.message}`, 'error');
            }
        }

        async function testLogin() {
            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'sabaf@admin.com',
                        password: 'password'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult('login-result', `✅ AuthController Login Success!\n${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    showResult('login-result', `❌ AuthController Login Failed!\n${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                showResult('login-result', `❌ AuthController Login Error: ${error.message}`, 'error');
            }
        }

        async function testSimpleLogin() {
            try {
                const response = await fetch(`${API_BASE}/simple-login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'sabaf@admin.com',
                        password: 'password'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showResult('login-result', `✅ Simple Login Success!\n${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    showResult('login-result', `❌ Simple Login Failed!\n${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                showResult('login-result', `❌ Simple Login Error: ${error.message}`, 'error');
            }
        }

        async function testAllLogins() {
            const accounts = [
                { email: 'sabaf@admin.com', password: 'password', role: 'admin' },
                { email: 'admin@library.com', password: 'password', role: 'admin' },
                { email: 'librarian@library.com', password: 'password', role: 'librarian' },
                { email: 'user@library.com', password: 'password', role: 'user' },
                { email: 'alice@student.com', password: 'password', role: 'user' }
            ];

            let results = 'Testing all demo accounts:\n\n';
            
            for (const account of accounts) {
                try {
                    const response = await fetch(`${API_BASE}/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            email: account.email,
                            password: account.password
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        results += `✅ ${account.email} (${account.role}) - SUCCESS\n`;
                    } else {
                        results += `❌ ${account.email} (${account.role}) - FAILED: ${data.message || 'Unknown error'}\n`;
                    }
                } catch (error) {
                    results += `❌ ${account.email} (${account.role}) - ERROR: ${error.message}\n`;
                }
            }
            
            showResult('all-login-result', results, 'info');
        }

        // Auto-run basic test on page load
        window.onload = function() {
            testAPI();
        };
    </script>
</body>
</html>
