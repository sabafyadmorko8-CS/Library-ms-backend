<!DOCTYPE html>
<html>
<head>
    <title>Book Management Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 15px; margin: 5px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a87; }
        .result { margin: 10px 0; padding: 10px; border-radius: 3px; white-space: pre-wrap; font-family: monospace; max-height: 300px; overflow-y: auto; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; width: 200px; }
        .form-group { margin: 10px 0; }
        label { display: inline-block; width: 100px; }
        .form-row { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>📚 Book Management Test</h1>
    
    <div class="test-section">
        <h3>Step 1: Setup</h3>
        <button onclick="createDemoBooks()">Create Demo Books</button>
        <button onclick="listBooks()">List All Books</button>
        <div id="setup-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 2: Create New Book</h3>
        <div class="form-row">
            <label>Title:</label>
            <input type="text" id="book-title" value="Test Book" />
        </div>
        <div class="form-row">
            <label>Author:</label>
            <input type="text" id="book-author" value="Test Author" />
        </div>
        <div class="form-row">
            <label>ISBN:</label>
            <input type="text" id="book-isbn" value="978-1-234-56789-0" />
        </div>
        <div class="form-row">
            <label>Quantity:</label>
            <input type="number" id="book-quantity" value="5" min="0" />
        </div>
        <button onclick="createBook()">Create Book</button>
        <div id="create-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 3: Update Book</h3>
        <div class="form-row">
            <label>Book ID:</label>
            <input type="number" id="update-id" placeholder="Enter book ID" />
        </div>
        <div class="form-row">
            <label>New Title:</label>
            <input type="text" id="update-title" placeholder="New title (optional)" />
        </div>
        <div class="form-row">
            <label>New Quantity:</label>
            <input type="number" id="update-quantity" placeholder="New quantity (optional)" min="0" />
        </div>
        <button onclick="updateBook()">Update Book</button>
        <div id="update-result" class="result"></div>
    </div>

    <div class="test-section">
        <h3>Step 4: Delete Book</h3>
        <div class="form-row">
            <label>Book ID:</label>
            <input type="number" id="delete-id" placeholder="Enter book ID to delete" />
        </div>
        <button onclick="deleteBook()">Delete Book</button>
        <div id="delete-result" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';

        function showResult(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.className = `result ${type}`;
            element.textContent = message;
        }

        async function makeRequest(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                const data = await response.json();
                return { success: response.ok, data, status: response.status };
            } catch (error) {
                return { success: false, error: error.message };
            }
        }

        async function createDemoBooks() {
            const result = await makeRequest('/create-demo-books');
            if (result.success) {
                showResult('setup-result', `✅ Demo Books Created!\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('setup-result', `❌ Failed to create demo books: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function listBooks() {
            const result = await makeRequest('/books');
            if (result.success) {
                showResult('setup-result', `✅ Books List:\n${JSON.stringify(result.data, null, 2)}`, 'success');
            } else {
                showResult('setup-result', `❌ Failed to list books: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function createBook() {
            const bookData = {
                title: document.getElementById('book-title').value,
                author: document.getElementById('book-author').value,
                isbn: document.getElementById('book-isbn').value,
                quantity: parseInt(document.getElementById('book-quantity').value)
            };

            const result = await makeRequest('/books', {
                method: 'POST',
                body: JSON.stringify(bookData)
            });

            if (result.success) {
                showResult('create-result', `✅ Book Created!\n${JSON.stringify(result.data, null, 2)}`, 'success');
                listBooks(); // Refresh the list
            } else {
                showResult('create-result', `❌ Failed to create book: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function updateBook() {
            const bookId = document.getElementById('update-id').value;
            if (!bookId) {
                showResult('update-result', '❌ Please enter a book ID', 'error');
                return;
            }

            const updateData = {};
            const newTitle = document.getElementById('update-title').value;
            const newQuantity = document.getElementById('update-quantity').value;

            if (newTitle) updateData.title = newTitle;
            if (newQuantity) updateData.quantity = parseInt(newQuantity);

            if (Object.keys(updateData).length === 0) {
                showResult('update-result', '❌ Please enter at least one field to update', 'error');
                return;
            }

            const result = await makeRequest(`/books/${bookId}`, {
                method: 'PUT',
                body: JSON.stringify(updateData)
            });

            if (result.success) {
                showResult('update-result', `✅ Book Updated!\n${JSON.stringify(result.data, null, 2)}`, 'success');
                listBooks(); // Refresh the list
            } else {
                showResult('update-result', `❌ Failed to update book: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        async function deleteBook() {
            const bookId = document.getElementById('delete-id').value;
            if (!bookId) {
                showResult('delete-result', '❌ Please enter a book ID', 'error');
                return;
            }

            if (!confirm(`Are you sure you want to delete book ID ${bookId}?`)) {
                return;
            }

            const result = await makeRequest(`/books/${bookId}`, {
                method: 'DELETE'
            });

            if (result.success) {
                showResult('delete-result', `✅ Book Deleted!\n${JSON.stringify(result.data, null, 2)}`, 'success');
                listBooks(); // Refresh the list
            } else {
                showResult('delete-result', `❌ Failed to delete book: ${result.error || JSON.stringify(result.data)}`, 'error');
            }
        }

        // Auto-run setup on page load
        window.onload = function() {
            listBooks();
        };
    </script>
</body>
</html>
